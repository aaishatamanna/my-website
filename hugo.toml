baseURL = 'https://aaishaarchive.com/'
locale = 'en-us'
title = "Aaisha's Archive"
theme = 'hextra'

# Suppress raw HTML warning
ignoreLogs = ['warning-goldmark-raw-html']

# Allow inline HTML inside Markdown
[markup.goldmark.renderer]
  unsafe = true

