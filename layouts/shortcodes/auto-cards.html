<div class="hextra-cards mt-4 grid gap-4 grid-cols-1">
  {{ range .Page.Pages }}
    <a href="{{ .RelPermalink }}" class="hextra-card group flex flex-col justify-between overflow-hidden rounded-lg border border-neutral-200 p-4 transition-all hover:border-neutral-300 dark:border-neutral-800 dark:hover:border-neutral-700">
      <div>
        <div class="font-semibold text-lg text-gray-900 dark:text-gray-100 group-hover:text-primary-600 dark:group-hover:text-primary-400">
          {{ .Title }}
        </div>
        {{ if .Params.description }}
          <div class="text-sm text-gray-500 dark:text-gray-400 mt-2">
            {{ .Params.description }}
          </div>
        {{ end }}
      </div>
    </a>
  {{ end }}
</div>
